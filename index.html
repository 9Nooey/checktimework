<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลาทำงาน | Work Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Top Header & Clock -->
    <div class="bg-slate-900 text-white p-6 text-center relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-blue-600/20 rounded-full blur-2xl"></div>
      <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">Time Attendance</div>
      <div id="clock" class="text-4xl font-extrabold tracking-wider text-white">00:00:00</div>
      <div id="date" class="text-xs text-slate-400 mt-1 font-light">กำลังโหลด...</div>
    </div>

    <!-- Form Section -->
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสพนักงาน</label>
        <div class="relative">
          <i class="fa-solid fa-id-badge absolute left-3 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="empId" placeholder="เช่น EMP-001" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อ-นามสกุล</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="empName" placeholder="เช่น สมชาย ใจดี" class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="recordTime('CHECK_IN')" class="flex flex-col items-center justify-center p-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl shadow-sm transition active:scale-95 group">
          <i class="fa-solid fa-arrow-right-to-bracket text-xl mb-1 group-hover:scale-110 transition"></i>
          <span class="font-medium text-sm">เข้างาน (Check-in)</span>
        </button>

        <button onclick="recordTime('CHECK_OUT')" class="flex flex-col items-center justify-center p-4 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl shadow-sm transition active:scale-95 group">
          <i class="fa-solid fa-arrow-right-from-bracket text-xl mb-1 group-hover:scale-110 transition"></i>
          <span class="font-medium text-sm">ออกงาน (Check-out)</span>
        </button>
      </div>

      <!-- Status Alert Box -->
      <div id="statusBox" class="hidden p-3.5 rounded-xl text-xs flex items-start space-x-2 transition">
        <i id="statusIcon" class="fa-solid mt-0.5"></i>
        <div id="statusMsg" class="flex-1"></div>
      </div>

      <!-- Recent Log Section -->
      <div class="pt-2 border-t border-slate-100">
        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">ประวัติการลงเวลาล่าสุดบนเครื่องนี้</div>
        <div id="recentLogs" class="space-y-1.5 text-xs text-slate-600">
          <div class="text-slate-400 italic text-[11px]">ยังไม่มีประวัติการลงเวลา</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ใส่ Web App URL จาก Google Apps Script ที่นี่
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzA5Rp5Vvr0c4jwar_duQztF174Fo7Xuzh6o8JXGpHl9fM8NBSKtfynQWNNiVTB2cigPw/exec";

    // อัปเดตเวลานาฬิกา
    function initClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('th-TH');
      document.getElementById('date').textContent = now.toLocaleDateString('th-TH', { 
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
      });
    }
    setInterval(initClock, 1000);
    initClock();

    // ดึงข้อมูลที่เคยบันทึกไว้ในเบราว์เซอร์
    window.onload = () => {
      if (localStorage.getItem('empId')) document.getElementById('empId').value = localStorage.getItem('empId');
      if (localStorage.getItem('empName')) document.getElementById('empName').value = localStorage.getItem('empName');
      renderRecentLogs();
    };

    function recordTime(actionType) {
      const empId = document.getElementById('empId').value.trim();
      const empName = document.getElementById('empName').value.trim();

      if (!empId || !empName) {
        showStatus('กรุณากรอกรหัสพนักงานและชื่อให้ครบถ้วน', 'warning');
        return;
      }

      // จำค่าไว้ใช้งานครั้งถัดไป
      localStorage.setItem('empId', empId);
      localStorage.setItem('empName', empName);

      if (!navigator.geolocation) {
        showStatus('เบราว์เซอร์นี้ไม่รองรับการดึงพิกัด GPS', 'error');
        return;
      }

      showStatus('กำลังระบุพิกัด GPS และบันทึกข้อมูล...', 'loading');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const payload = {
            empId: empId,
            name: empName,
            action: actionType,
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          };

          try {
            const response = await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === "success") {
              const statusText = result.isWithinRadius ? 'ในพื้นที่' : 'นอกพื้นที่';
              const text = `บันทึกสำเร็จ (${statusText}) | ระยะห่าง: ${result.distance} ม.`;
              showStatus(text, result.isWithinRadius ? 'success' : 'warning');
              saveLocalLog(actionType, result.timestamp, statusText);
            } else {
              showStatus('เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'error');
            }
          } catch (err) {
            showStatus('ไม่สามารถเชื่อมต่อระบบเซิร์ฟเวอร์ได้', 'error');
          }
        },
        (error) => {
          showStatus('ไม่สามารถเข้าถึงตำแหน่ง GPS ได้ กรุณาอนุญาตการเข้าถึง Location', 'error');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function showStatus(message, type) {
      const box = document.getElementById('statusBox');
      const msg = document.getElementById('statusMsg');
      const icon = document.getElementById('statusIcon');

      box.className = "p-3.5 rounded-xl text-xs flex items-start space-x-2 transition";
      icon.className = "fa-solid mt-0.5";

      if (type === 'loading') {
        box.classList.add('bg-blue-50', 'text-blue-700');
        icon.classList.add('fa-spinner', 'fa-spin');
      } else if (type === 'success') {
        box.classList.add('bg-emerald-50', 'text-emerald-700');
        icon.classList.add('fa-circle-check');
      } else if (type === 'warning') {
        box.classList.add('bg-amber-50', 'text-amber-700');
        icon.classList.add('fa-triangle-exclamation');
      } else if (type === 'error') {
        box.classList.add('bg-rose-50', 'text-rose-700');
        icon.classList.add('fa-circle-xmark');
      }

      msg.innerText = message;
      box.classList.remove('hidden');
    }

    function saveLocalLog(action, time, areaStatus) {
      let logs = JSON.parse(localStorage.getItem('work_logs') || '[]');
      logs.unshift({ action, time, areaStatus });
      if (logs.length > 3) logs.pop();
      localStorage.setItem('work_logs', JSON.stringify(logs));
      renderRecentLogs();
    }

    function renderRecentLogs() {
      const logs = JSON.parse(localStorage.getItem('work_logs') || '[]');
      const container = document.getElementById('recentLogs');
      if (logs.length === 0) return;

      container.innerHTML = logs.map(item => `
        <div class="flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-100">
          <span class="font-semibold ${item.action === 'CHECK_IN' ? 'text-emerald-600' : 'text-rose-600'}">
            ${item.action === 'CHECK_IN' ? 'เข้างาน' : 'ออกงาน'}
          </span>
          <span class="text-slate-400 text-[11px]">${item.time.split(' ')[1]} (${item.areaStatus})</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
